name: colportores_mobile
description: App móvil del colportor — offline-first (Colportaje App).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Stack según ADR-007. Las dependencias de mapa y GPS se agregan en el sprint que las introduce
# (S5 mapa) — no antes. Supabase entró en S3 (auth real, #22).
#
# Nota: ADR-007 dice "Riverpod 2.x". Con Dart 3.12 la línea 2.x ya no resuelve junto a
# `test` (analyzer ≥ 8), así que se adopta Riverpod 3.x (misma API de codegen,
# `Ref` unificado, el generador quita el sufijo `Notifier`). Pendiente: nota en ADR-007.
#
# Nota: `flutter_secure_storage` queda en la línea 10.x a propósito. La 11.0.0 compila contra
# Android SDK 37 y el proyecto compila contra la 36 (`flutter.compileSdkVersion` de Flutter
# 3.44), así que el job `build-android` falla. Subir a 11 implica subir el compileSdk del
# proyecto — decisión de infra aparte, no de este wrapper. La API que usa
# `core/secure_storage/` (read/write/delete/deleteAll) es la misma en las dos líneas.
#
# Nota: `riverpod_lint` **no está en este pubspec**: corre como plugin nativo del analyzer,
# declarado en `analysis_options.yaml` y envuelto en `tool/riverpod_lint_plugin` (issue #87,
# opción (a) de #6). Por eso el análisis es `dart analyze --fatal-infos`: `flutter analyze` no
# muestra los diagnósticos de plugins. `custom_lint` salió: su 0.8.1 quedó en analyzer ^8, no
# convivía con `drift_dev` y desde riverpod_lint 3.1.0 ya no corría ninguna regla.
#
# Nota: `drift_dev` queda en 2.34.0 porque `flutter_test` 3.44 fija `test_api` 0.7.11 → `test`
# 1.31 → analyzer < 13, y drift_dev ≥ 2.34.1 pide analyzer ^13. `drift` va fijo en 2.34.0, su
# pareja: `drift_dev make-migrations` y `SchemaVerifier` no compilan con drift 2.34.1 a 2.34.4
# (decisión de Cristian del 23/09 en #70; lo que se pierde es de web, `rowid` de tablas virtuales
# y `MultiExecutor`, que la app no usa). Al subir Flutter a 3.47 o más (destraba analyzer 13) se
# vuelve a `^` y se sube `drift_dev`.
dependencies:
  app_links: ^7.2.1          # deep link propio de verificación de email (#84) — antes transitiva
                              # vía supabase_flutter, ahora también uso directo en AuthRemoteDataSourceSupabase
  characters: ^1.4.1        # largo de la contraseña en caracteres visibles (PoliticaPassword) — antes transitiva
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dartz: ^0.10.1            # Either<Failure, T> (convenciones §4.3)
  drift: 2.34.0             # DB local (ADR-009); cifrada con SQLCipher (ADR-006) — fijo: ver nota arriba
  drift_flutter: ^0.3.1     # driftDatabase(): archivo, isolate de fondo y temp dir de sqlite en Android
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0  # estado / DI
  flutter_secure_storage: ^10.3.1  # Keystore/Keychain: sal de cifrado (ADR-003) — ver nota arriba
  geolocator: ^14.0.2       # GPS del alta de ubicación (HU-UBI-001, ADR-009)
  http: ^1.6.0
  logger: ^2.7.0            # [NIVEL][MÓDULO][OPERACIÓN] (convenciones §7)
  maplibre_gl: ^0.27.1      # mapa nativo MapLibre (ADR-009/011, decisión del 06/10, #286): PMTiles propios, online y offline
  path: ^1.9.1
  path_provider: ^2.1.6     # directorio de la DB local (core/database)
  riverpod_annotation: ^4.0.0
  # libsodium (ADR-006, S11): Argon2id y el cifrado autenticado de la DEK envuelta por contraseña.
  # ADR-006 nombra `sodium` + `sodium_libs`, pero `sodium_libs` quedó discontinuado en la 4.x
  # ("replaced by sodium"): desde la 4.0, `sodium` compila libsodium con build hooks para cada
  # plataforma (como `sqlite3`), así que es el único paquete necesario. La 4.1 pide Dart 3.13.
  sodium: ^4.0.4
  sqlite3: ^3.5.2           # solo para `PRAGMA key` en el setup de la conexión (core/database)
  supabase_flutter: ^2.17.2 # Supabase Auth (ADR-016, HU-AUTH-003); trae app_links (deep link de los enlaces del correo)
  uuid: ^4.6.0              # UUID v7 (esquema-datos.md §Principios)

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0        # codegen de tablas de `core/database` (ver nota arriba)
  fake_async: ^1.3.3        # tests con el reloj falso (reintentos de la descarga de tiles)
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0
  test: ^1.31.0             # tests de dominio/data sin importar Flutter (CLAUDE.md §Tests)

flutter:
  uses-material-design: true

  # Estilo, glyphs y sprites del mapa (copia de lo que publica backend-supabase#42, ver
  # assets/mapa/NOTICE.md). Los glyphs y sprites se copian al almacenamiento interno al abrir el
  # mapa (`PreparadorRecursosMapa`): MapLibre los lee con `file://`.
  assets:
    - assets/mapa/estilo/
    - assets/mapa/glyphs/NotoSans-Regular/
    - assets/mapa/glyphs/NotoSans-Medium/
    - assets/mapa/glyphs/NotoSans-Italic/
    - assets/mapa/glyphs/OFL.txt
    - assets/mapa/sprites/

  # Offline-first: nada de `google_fonts` con fetch en runtime. Empaquetadas desde el repo oficial
  # https://github.com/google/fonts (licencia OFL, ver assets/fonts/*-OFL.txt). Las tres familias
  # solo están disponibles ahí como fuente variable (sin instancias estáticas por peso) — se
  # registra el mismo archivo una vez por peso usado; Flutter/Skia interpola el eje `wght`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500
# SQLCipher (ADR-003). `package:sqlite3` 3.x empaqueta SQLite con hooks de Dart y baja, según este
# `source`, el binario precompilado de cada plataforma desde sus releases de GitHub (verificado por
# sha256). `sqlcipher` = SQLCipher community edition, que es lo que fija ADR-003/ADR-007; el paquete
# `sqlcipher_flutter_libs` que nombran esos ADR está EOL (0.7.0+eol, "no longer does anything") y
# este es su reemplazo oficial. Drift hoy recomienda `sqlite3mc` (SQLite3MultipleCiphers) para apps
# nuevas — cambiar de librería de cifrado es una decisión de ADR, no de este archivo.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
