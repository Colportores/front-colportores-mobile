name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Misma versión que dockerfile.dev. Subirlas juntas.
  FLUTTER_VERSION: "3.44.0"

jobs:
  verificar:
    name: format · analyze · lint · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # *.g.dart no se commitea (.gitignore): se genera en cada corrida.
      - run: dart run build_runner build

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: dart run custom_lint --fatal-infos
      - run: flutter test --coverage

      - name: Umbrales de cobertura (total ≥ 70%, dominio ≥ 90%)
        run: bash scripts/coverage_check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: build apk (debug)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
