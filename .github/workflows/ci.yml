name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    # feature/**: los PR apilados (feature/x → feature/y) también corren CI.
    branches: [develop, staging, production, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Misma versión que dockerfile.dev. Subirlas juntas. Al pasar a Dart >= 3.13 se borra
  # tool/riverpod_lint_plugin y analysis_options.yaml declara `riverpod_lint: ^3.1.9` (ver #87).
  FLUTTER_VERSION: "3.44.0"

# Solo los checks que gatean el merge. Los compilados (APK/AAB) y las publicaciones salen de staging.yml y production.yml.
jobs:
  # Formato, análisis, motor y proveedores de auth: ~5 min, en paralelo con los tests.
  estatico:
    name: format · analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # *.g.dart no se commitea (.gitignore): se genera en cada corrida.
      - run: dart run build_runner build

      # Solo archivos versionados: excluye *.g.dart (generado, formato propio del generador).
      - name: dart format (archivos versionados)
        run: git ls-files -z -- 'lib/*.dart' 'test/*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      # El motor es un paquete aparte con su propia suite (§8 del contrato) y núcleo Dart puro:
      # corre en la VM, sin emulador. `flutter test` solo mira el `test/` de la app, así que sin
      # este paso sus tests no los ejecuta nadie — y ahí vive la lógica de la cola, los lotes, los
      # conflictos y el backup.
      - name: sync_engine (paquete Dart puro)
        working-directory: packages/sync_engine
        run: |
          dart pub get
          dart analyze
          dart test

      # `dart analyze` y no `flutter analyze`: este último no muestra los diagnósticos de plugins,
      # y las reglas de Riverpod vienen del plugin (analysis_options.yaml → plugins).
      - run: dart analyze --fatal-infos

      # Variables de repo (no secrets: la anon key es pública). Sin ellas el paso se omite.
      - name: Proveedores de Supabase Auth (solo email, sin apple)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: bash scripts/check_auth_providers.sh

  # La suite de la app partida en 5 tandas (23/10: en un solo job tardaba 14-18 min y rozaba el límite).
  # Cada tanda sube su lcov; el job `cobertura` los junta y verifica los umbrales.
  tests:
    name: test (${{ matrix.tanda }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tanda: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # --shard-index va de 0 a 4.
      - name: flutter test (tanda ${{ matrix.tanda }} de 5)
        run: flutter test --coverage --total-shards 5 --shard-index $(( ${{ matrix.tanda }} - 1 ))

      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.tanda }}
          path: coverage/lcov.info
          retention-days: 7

  # Mantiene el nombre del job de antes ("format · analyze · test · coverage"): es el que miran la tubería y las reglas del repo.
  cobertura:
    name: format · analyze · test · coverage
    needs: [estatico, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: lcov-tandas

      # Suma los aciertos de cada línea entre las tandas (un mismo archivo puede aparecer en varias).
      - name: Juntar la cobertura de las tandas
        run: |
          mkdir -p coverage
          python3 - <<'PY'
          import glob
          from collections import defaultdict
          cob = defaultdict(lambda: defaultdict(int))
          for ruta in sorted(glob.glob('lcov-tandas/*/lcov.info')):
              sf = None
              for linea in open(ruta, encoding='utf-8'):
                  linea = linea.strip()
                  if linea.startswith('SF:'):
                      sf = linea[3:]
                  elif linea.startswith('DA:') and sf:
                      n, hits = linea[3:].split(',')[:2]
                      cob[sf][int(n)] += int(hits)
          with open('coverage/lcov.info', 'w', encoding='utf-8') as out:
              for sf in sorted(cob):
                  out.write(f'SF:{sf}\n')
                  for n in sorted(cob[sf]):
                      out.write(f'DA:{n},{cob[sf][n]}\n')
                  out.write(f'LF:{len(cob[sf])}\nLH:{sum(1 for h in cob[sf].values() if h > 0)}\nend_of_record\n')
          print(f'{len(cob)} archivos de {len(glob.glob("lcov-tandas/*/lcov.info"))} tandas')
          PY

      - name: Umbrales de cobertura (total ≥ 70%, dominio ≥ 90%)
        run: bash scripts/coverage_check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
