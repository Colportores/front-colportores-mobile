# Configuración de `drift_dev` (convenciones-desarrollo §9): `dart run drift_dev make-migrations`
# congela el esquema de cada versión en `drift_schemas/` y genera
# `lib/core/database/app_database.steps.dart` (los pasos N → N+1 contra el esquema congelado) y los
# tests de migración de `test/drift/`. Se corre cada vez que sube `AppDatabase.versionEsquema`.
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
